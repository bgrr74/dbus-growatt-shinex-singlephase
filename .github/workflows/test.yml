name: Test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m py_compile dbus-growatt-shinex.py growatt_shinex.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n install.sh restart.sh uninstall.sh
